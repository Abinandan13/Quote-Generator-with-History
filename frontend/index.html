<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote Generator with History</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <!-- ───────── Navbar ───────── -->
  <header>
    <nav class="navbar">
      <div class="navbar-inner">
        <div class="navbar-brand">
          <!-- Lucide-style sparkle/sparkles icon -->
          <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/>
          </svg>
          <span class="brand-name">Quote Generator</span>
        </div>
        <div class="navbar-actions">
          <span class="live-status-pill" id="backendStatusPill" title="Backend Status">
            <span class="status-dot"></span>
            <span class="status-text">Connected</span>
          </span>
        </div>
      </div>
    </nav>
  </header>

  <!-- ───────── Main Content ───────── -->
  <main class="main">
    <!-- Quote Card -->
    <section class="quote-card" aria-label="Quote display">
      <!-- Decorative quotation mark -->
      <div class="quote-decoration" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44"
             viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.3 2.6c-3.15.86-5.7 3.21-6.8 6.27A9.72 9.72 0 0 0 4 12.5c0 1.03.16 2.05.47 3.02A7.5 7.5 0 0 0 11 21.5a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1 3.5 3.5 0 0 1-3.37-2.57A5.67 5.67 0 0 1 7.5 12c0-.54.08-1.08.23-1.6a5.72 5.72 0 0 1 4.37-3.95 1 1 0 0 0 .78-1.18l-.6-2.88Z"/>
          <path d="M21.3 2.6c-3.15.86-5.7 3.21-6.8 6.27A9.72 9.72 0 0 0 14 12.5c0 1.03.16 2.05.47 3.02A7.5 7.5 0 0 0 21 21.5a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1 3.5 3.5 0 0 1-3.37-2.57A5.67 5.67 0 0 1 17.5 12c0-.54.08-1.08.23-1.6a5.72 5.72 0 0 1 4.37-3.95 1 1 0 0 0 .78-1.18l-.6-2.88Z"/>
        </svg>
      </div>

      <!-- Quote content area -->
      <div class="quote-body">
        <p class="quote-text" id="quoteText">
          Click <strong>New Quote</strong> to generate an inspiring quote.
        </p>
        <p class="quote-author" id="quoteAuthor"></p>

        <!-- Dynamic Error State Container with Retry -->
        <div class="quote-error-container hidden" id="quoteErrorContainer">
          <p class="error-detail" id="errorDetailText"></p>
          <button class="btn btn-retry" id="retryBtn" type="button">
            <!-- Lucide-style refresh-cw icon -->
            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
            </svg>
            Retry Now
          </button>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="quote-actions">
        <button class="btn btn-primary" id="newQuoteBtn" type="button">
          <!-- Lucide-style refresh icon -->
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
          <span id="newQuoteBtnLabel">New Quote</span>
        </button>

        <button class="btn btn-secondary" id="copyQuoteBtn" type="button">
          <!-- Lucide-style copy icon -->
          <svg class="btn-icon copy-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
          </svg>
          <!-- Lucide-style check icon (shown after copy) -->
          <svg class="btn-icon check-icon hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5"/>
          </svg>
          <span id="copyBtnLabel">Copy Quote</span>
        </button>
      </div>
    </section>

    <!-- ───────── Quote History ───────── -->
    <section class="history-section" aria-label="Quote history">
      <div class="history-header">
        <div class="history-title-wrap">
          <!-- Lucide-style clock icon -->
          <svg class="history-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <h2 class="history-title">Quote History</h2>
          <span class="history-badge hidden" id="historyBadge">0</span>
        </div>
      </div>

      <!-- History list (populated dynamically from SQLite database) -->
      <div class="history-list" id="historyList">
        <!-- Empty state -->
        <div class="history-empty" id="historyEmpty">
          <!-- Lucide-style inbox icon -->
          <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" width="44" height="44"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
            <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
          </svg>
          <p class="empty-title">No quotes yet</p>
          <p class="empty-subtitle">Your quote history will appear here</p>
        </div>
      </div>
    </section>
  </main>

  <!-- ───────── Toast notification ───────── -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
